name: Verify lab

on:
  pull_request:
  push:
    branches: [main, prelaunch-interactive-lab, astro-immersive-migration]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Evaluation Workbench
        working-directory: apps/evaluation-workbench
        run: python -m unittest discover -s tests -v
